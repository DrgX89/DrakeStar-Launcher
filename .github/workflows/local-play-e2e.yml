name: Local play E2E

# Prueba real del boton JUGAR en la instancia `local` (preset «Slimefun en solitario / LAN»): servidor DrakesPurpur 26.2
# + cliente Fabric 26.2 bajo Xvfb/llvmpipe en un runner efimero. Exito = el servidor anuncia que DrakeTest entro;
# la captura y los logs quedan como artefacto.
on:
  workflow_dispatch:
    inputs:
      lan: { description: 'Abrir a la LAN (0|1)', required: false, default: '1' }
      performance: { description: 'Mods de rendimiento (0|1)', required: false, default: '1' }
      fused: { description: 'Fused con servidor embebido en la misma JVM (0|1)', required: false, default: '0' }
  pull_request:
    paths: ['.github/workflows/local-play-e2e.yml', 'crates/drakestar-mc/examples/local_play_e2e.rs', 'crates/drakestar-mc/src/play.rs', 'crates/drakestar-mc/src/server.rs']

permissions:
  contents: read

jobs:
  play:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Xvfb, Mesa y captura
        run: |
          for i in 1 2 3; do sudo apt-get update && break || sleep 5; done
          sudo apt-get install -y xvfb libgl1-mesa-dri libegl1 libglx-mesa0 mesa-utils imagemagick x11-utils
      - run: cargo build -p drakestar-mc --example local_play_e2e
      - name: Artefactos Fused embebido (solo si fused=1)
        if: ${{ inputs.fused == '1' }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Compilar jar Fabric de Fused con host embebido y bajar monolito b141
        if: ${{ inputs.fused == '1' }}
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'
      - name: Preparar DRAKESTAR_FUSED_JAR y DRAKESTAR_PURPUR_JAR
        if: ${{ inputs.fused == '1' }}
        run: |
          git clone --depth 1 --branch spike/embedded-isolation-20261117 https://github.com/SlimefunNewHorizons/drakestar-fused.git "$RUNNER_TEMP/drakestar-fused"
          (cd "$RUNNER_TEMP/drakestar-fused" && gradle --no-daemon :fabric:build)
          FUSED_JAR="$(ls "$RUNNER_TEMP"/drakestar-fused/fabric/build/libs/drakestar-fused-fabric-universal-*.jar | grep -v -- '-sources\|-javadoc' | head -1)"
          test -f "$FUSED_JAR"
          echo "DRAKESTAR_FUSED_JAR=$FUSED_JAR" >> "$GITHUB_ENV"
          PURPUR_JAR="$RUNNER_TEMP/purpur-paperclip-26.2.build.141-stable.jar"
          curl -fsSL -o "$PURPUR_JAR" "https://github.com/SlimefunNewHorizons/DrakesPurpur/releases/download/26.2-drakes.141/purpur-paperclip-26.2.build.141-stable.jar"
          echo "30ff10f692c12df7a8260ed0f1ba1fa898968b7ee561d4ac087545a19a1e7ffe  $PURPUR_JAR" | sha256sum -c
          echo "DRAKESTAR_PURPUR_JAR=$PURPUR_JAR" >> "$GITHUB_ENV"
      - name: JUGAR (servidor local + cliente 26.2)
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GITHUB_TOKEN: ${{ github.token }}
          LAN: ${{ inputs.lan || '1' }}
          PERF: ${{ inputs.performance || '1' }}
          FUSED: ${{ inputs.fused || '0' }}
        run: |
          Xvfb :77 -screen 0 1280x720x24 & sleep 2
          export DISPLAY=:77
          glxinfo -B | grep -E 'renderer|version' || true
          target/debug/examples/local_play_e2e "$HOME/.drakestar-e2e" "$LAN" 4096 "$PERF" 1200 "$PWD/jugar-local.png" "$FUSED"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-play-e2e
          path: |
            jugar-local.png
            ~/.drakestar-e2e/**/logs/*.log
            ~/.drakestar-e2e/**/server.properties
          if-no-files-found: warn
