<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="DrakeStar Launcher — DrakesCraft Labs">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090717"/>
      <stop offset="50%" stop-color="#140c2e"/>
      <stop offset="100%" stop-color="#081326"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7">
        <animate attributeName="stop-color" values="#a855f7;#38bdf8;#c084fc;#a855f7" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#38bdf8">
        <animate attributeName="stop-color" values="#38bdf8;#c084fc;#a855f7;#38bdf8" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#22d3ee">
        <animate attributeName="stop-color" values="#22d3ee;#a855f7;#38bdf8;#22d3ee" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <radialGradient id="nebula1" cx="20%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebula2" cx="82%" cy="65%" r="42%">
      <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="18" fill="url(#nebula1)"/>
  <rect width="1200" height="300" rx="18" fill="url(#nebula2)"/>
  <rect x="2" y="2" width="1196" height="296" rx="16" fill="none" stroke="url(#accent)" stroke-opacity="0.45" stroke-width="1.5"/>

  <!-- Subtle orbital grid -->
  <g stroke="#a855f7" stroke-opacity="0.12" fill="none">
    <ellipse cx="960" cy="150" rx="190" ry="62" transform="rotate(-14 960 150)"/>
    <ellipse cx="960" cy="150" rx="130" ry="42" transform="rotate(18 960 150)"/>
  </g>

  <!-- Animated twinkling stars -->
  <g fill="#e0f2fe">
    <circle cx="95" cy="58" r="1.8"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="240" cy="42" r="1.3"><animate attributeName="opacity" values="0.8;0.2;0.8" dur="4.1s" repeatCount="indefinite"/></circle>
    <circle cx="460" cy="36" r="1.5"><animate attributeName="opacity" values="0.3;0.95;0.3" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="710" cy="52" r="2.0"><animate attributeName="opacity" values="0.9;0.2;0.9" dur="3.7s" repeatCount="indefinite"/></circle>
    <circle cx="1090" cy="64" r="1.7"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.0s" repeatCount="indefinite"/></circle>
    <circle cx="145" cy="248" r="1.5"><animate attributeName="opacity" values="0.7;0.15;0.7" dur="4.5s" repeatCount="indefinite"/></circle>
    <circle cx="590" cy="264" r="1.4"><animate attributeName="opacity" values="0.25;0.9;0.25" dur="3.5s" repeatCount="indefinite"/></circle>
    <circle cx="1040" cy="244" r="1.9"><animate attributeName="opacity" values="0.85;0.2;0.85" dur="2.9s" repeatCount="indefinite"/></circle>
  </g>

  <!-- Star emblem on the right -->
  <g transform="translate(960,150)" filter="url(#glow)">
    <polygon points="0,-54 14,-14 54,0 14,14 0,54 -14,14 -54,0 -14,-14" fill="url(#accent)" opacity="0.92">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="36s" repeatCount="indefinite"/>
    </polygon>
    <circle cx="0" cy="0" r="11" fill="#ffffff" opacity="0.95">
      <animate attributeName="r" values="9.5;12;9.5" dur="3.5s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Title & subtitle -->
  <g font-family="Segoe UI, Inter, -apple-system, BlinkMacSystemFont, sans-serif">
    <text x="72" y="102" fill="#38bdf8" font-size="14" font-weight="700" letter-spacing="4">DRAKESCRAFT LABS · SLIMEFUN NEW HORIZONS</text>
    <text x="70" y="164" fill="#ffffff" font-size="54" font-weight="800" letter-spacing="1">DrakeStar Launcher</text>
    <rect x="72" y="182" width="430" height="3" rx="1.5" fill="url(#accent)"/>
    <text x="72" y="218" fill="#cbd5e1" font-size="18" font-weight="500">One-Click Minecraft 1.20–26.2 · Dual Engine (Java 25 + Rust Horizon) · Local Monolith</text>

    <!-- Feature pills -->
    <g transform="translate(72,238)" font-size="12" font-weight="600">
      <rect x="0" y="0" width="118" height="26" rx="13" fill="#1e1b4b" stroke="#8b5cf6" stroke-opacity="0.7"/>
      <text x="59" y="17" fill="#e9d5ff" text-anchor="middle">Rust + Tauri v2</text>

      <rect x="130" y="0" width="142" height="26" rx="13" fill="#0c2a44" stroke="#38bdf8" stroke-opacity="0.7"/>
      <text x="201" y="17" fill="#bae6fd" text-anchor="middle">Signed Auto-Update</text>

      <rect x="284" y="0" width="152" height="26" rx="13" fill="#1b1838" stroke="#c084fc" stroke-opacity="0.7"/>
      <text x="360" y="17" fill="#f3e8ff" text-anchor="middle">Win · Linux · macOS</text>
    </g>
  </g>
</svg>
